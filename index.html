<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>García Herreros FC · Mi club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260930-1520">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-crest-wrap"><img src="logo-oficial.jpeg" alt="Escudo García Herreros FC" class="brand-crest"></div>
      <div><strong>GARCÍA<br>HERREROS</strong><span>FÚTBOL CLUB</span></div>
    </div>
    <div class="sidebar-label">MI CLUB</div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-grid"></i><span>Resumen</span></button>
      <button class="nav-item" data-view="players"><i data-lucide="users"></i><span>Deportistas</span></button>
      <button class="nav-item" data-view="attendance"><i data-lucide="clipboard-check"></i><span>Asistencia</span></button>
      <button class="nav-item" data-view="training"><i data-lucide="calendar-days"></i><span>Entrenamientos</span></button>
      <button class="nav-item" data-view="team"><i data-lucide="users-round"></i><span>Equipo y categorías</span></button>
      <button class="nav-item" data-view="access"><i data-lucide="shield-check"></i><span>Accesos</span></button>
      <button class="nav-item" data-view="payments"><i data-lucide="wallet-cards"></i><span>Pagos y cartera</span></button>
      <button class="nav-item" data-view="activity"><i data-lucide="clock-3"></i><span>Actividad</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" aria-label="Abrir menú"><i data-lucide="menu"></i></button>
      <div class="breadcrumb" id="breadcrumb">Mi club <span>/</span> <strong>Resumen</strong></div>
      <div class="topbar-actions"><span class="status-badge">BASE DEL CLUB</span><button class="ghost-btn">Salir</button></div>
    </header>
    <div class="context-strip">Fichas, asistencia y pagos con guardado permanente. <span>Archivos y correos pendientes.</span></div>
    <section id="viewRoot"></section>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<dialog id="playerCreateDialog" class="dialog player-form-dialog">
  <form id="playerCreateForm" method="dialog">
    <div class="dialog-head">
      <div><span class="eyebrow">FICHA DEPORTIVA</span><h2 id="playerFormTitle">Registrar deportista</h2></div>
      <button class="close-btn" value="cancel" aria-label="Cerrar">×</button>
    </div>

    <div class="form-section">
      <h3>Datos del deportista</h3>
      <div class="form-grid">
        <label>Nombre completo<input id="newPlayerName" required></label>
        <label>Tipo de documento
          <select id="newPlayerDocumentType">
            <option value="">Seleccionar</option>
            <option value="RC">Registro Civil (RC)</option>
            <option value="TI">Tarjeta de Identidad (TI)</option>
            <option value="CC">Cédula de Ciudadanía (CC)</option>
            <option value="CE">Cédula de Extranjería (CE)</option>
            <option value="PA">Pasaporte</option>
            <option value="PPT">Permiso por Protección Temporal (PPT)</option>
          </select>
        </label>
        <label>Número de documento<input id="newPlayerDocument" placeholder="Número de identificación"></label>
        <label>Categoría
          <select id="newPlayerCategory" required>
            <option value="">Seleccionar categoría</option>
            <option value="2020–2021">2020–2021</option>
            <option value="2019–2018">2019–2018</option>
            <option value="2017–2016">2017–2016</option>
            <option value="2015–2014">2015–2014</option>
            <option value="2013–2012">2013–2012</option>
            <option value="2010–2011–2009–2008">2010–2011–2009–2008</option>
          </select>
        </label>
        <label>Fecha de nacimiento<input id="newPlayerBirth" type="date"></label>
        <label>Estado
          <select id="newPlayerStatus">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </label>
        <label>Mensualidad<input id="newPlayerMonthly" type="number" min="0" step="1000" value="50000"></label>
      </div>
    </div>

    <div class="form-section">
      <h3>Acudiente y emergencia</h3>
      <div class="form-grid">
        <label>Acudiente<input id="newPlayerGuardian"></label>
        <label>Celular acudiente<input id="newPlayerPhone"></label>
        <label>Contacto de emergencia<input id="newPlayerEmergency"></label>
        <label>Celular emergencia<input id="newPlayerEmergencyPhone"></label>
      </div>
    </div>

    <div class="form-section">
      <h3>Información médica</h3>
      <div class="form-grid">
        <label>EPS<input id="newPlayerEps"></label>
        <label>Tipo de sangre<input id="newPlayerBlood" placeholder="Ej. O+"></label>
        <label class="span-2">Alergias<input id="newPlayerAllergies" placeholder="Ninguna, medicamentos, alimentos..."></label>
        <label class="span-2">Condiciones / observaciones médicas<input id="newPlayerConditions"></label>
      </div>
    </div>

    <div class="form-section">
      <h3>Seguimiento físico</h3>
      <div class="form-grid">
        <label>Estatura (cm)<input id="newPlayerHeight" type="number" min="0" step="0.1"></label>
        <label>Peso (kg)<input id="newPlayerWeight" type="number" min="0" step="0.1"></label>
        <label class="span-2">Observaciones<input id="newPlayerNotes"></label>
      </div>
    </div>

    <input id="editingPlayerId" type="hidden">
    <div class="dialog-actions">
      <button value="cancel" class="secondary">Cancelar</button>
      <button class="primary" type="submit" id="playerFormSubmit">Guardar ficha</button>
    </div>
  </form>
</dialog>

<dialog id="playerDialog" class="dialog player-dialog"><div id="playerDetail"></div></dialog>

<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="app.js?v=20260930-1520"></script>
</body>
</html>
